[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payraider"
version = "1.0.0"
description = "Official Python SDK for the PayRaider API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27,<1",
]

authors = [{ name = "PayRaider" }]
keywords = ["stellar", "payments", "off-ramp", "corridor", "payraider"]
classifiers = [
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/Pay-Raider/payraider-plugin"
Source = "https://github.com/Pay-Raider/payraider-plugin/tree/main/sdk/python"
Issues = "https://github.com/Pay-Raider/payraider-plugin/issues"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "testnet: marks tests as testnet integration tests (deselect with '-m \"not testnet\"')",
]
